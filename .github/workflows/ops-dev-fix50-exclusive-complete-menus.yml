name: OPS DEV fix50 exclusive complete menus

on:
  push:
    branches:
      - ops/dev-fix50-exclusive-complete-menus

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/dev-fix50-exclusive-complete-menus
          fetch-depth: 0

      - name: Build fix50 package
        run: python3 tools/ops_build_fix50.py

      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py

      - name: Validate JavaScript syntax
        run: |
          python3 -c "import base64,json,pathlib,subprocess,tempfile; p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-completar-exclusive-menus-fix50.json').read_text()); td=tempfile.TemporaryDirectory(); root=pathlib.Path(td.name); [(lambda out,raw:(out.write_bytes(raw),subprocess.run(['node','--check',str(out)],check=True)))(root/item['path'].replace('/','__'),base64.b64decode(item['content_base64'],validate=True)) for item in p['files'] if item['path'].endswith('.js')]"

      - name: Create DEV PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-completar-exclusive-menus-fix50.json dev/self-update.json dev/history.json
          git commit -m "dev: fix50 exclusive Completar Tarea menus"
          git push origin HEAD:dev/completar-exclusive-menus-fix50
          gh pr create --base main --head dev/completar-exclusive-menus-fix50 --title "DEV fix50: cerrar menús de Completar Tarea entre sí" --body "Corrige el caso reproducido por tracer. Sólo puede quedar abierto un menú de Completar Tarea a la vez. No modifica RELEASE."
