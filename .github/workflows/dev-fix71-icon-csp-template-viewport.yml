name: DEV fix71 icon CSP template viewport
on:
  push:
    branches: [dev/icon-csp-template-viewport-fix71]
    paths:
      - tools/ops_build_fix71.py
      - .github/workflows/dev-fix71-icon-csp-template-viewport.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/icon-csp-template-viewport-fix71
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix71.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-icon-csp-template-viewport-fix71.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Acceptance checks
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-icon-csp-template-viewport-fix71.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']).decode(errors='replace') for f in p['files'] if f['path'].endswith('.js')}
          bg=fs['background.js']; h=fs['js/97-home-ui.js']
          checks={
            'no fetch data icon':'fetch(dataUrl)' not in bg,
            'base64 local':'atob(payload)' in bg and 'new Blob([bytes]' in bg,
            'viewport aware':'ensureExpandedVisible' in h,
            'minimal reveal':'rect.bottom>bottomSafe' in h,
            'smooth scroll':"behavior:'smooth'" in h,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-icon-csp-template-viewport-fix71.json dev/self-update.json dev/history.json
          git commit -m "dev: build icon CSP template viewport fix71"
          git push origin HEAD:dev/icon-csp-template-viewport-fix71
