name: DEV fix90 equal update button size
on:
  push:
    branches: [dev/update-button-size-fix90]
    paths:
      - tools/ops_build_fix90.py
      - .github/workflows/dev-fix90-update-button-size.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/update-button-size-fix90
          fetch-depth: 0
      - name: Build DEV fix90
        run: python3 tools/ops_build_fix90.py
      - name: Validate DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-update-button-size-fix90.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate popup equal button sizing
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-update-button-size-fix90.json').read_text())
          files={f['path']:base64.b64decode(f['content_base64']).decode(errors='replace') for f in p['files']}
          h=files['popup.html']; j=files['popup.js']
          checks={
            'equal size class':'viena-update-equal-size' in h,
            'fixed equal height':'height:52px!important;' in h,
            'manual button preserved':'id="manualReleaseZip"' in h,
            'update button preserved':'id="openUpdate"' in h,
            'DEV eligibility preserved':"new Set(['efoschi'])" in j,
            'RELEASE eligibility preserved':"new Set(['mbruno'])" in j,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-update-button-size-fix90.json dev/self-update.json dev/history.json
          git commit -m "dev: equalize popup update button size fix90"
          git push origin HEAD:dev/update-button-size-fix90
