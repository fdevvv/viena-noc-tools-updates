name: Release compatibility floor

on:
  push:
    paths:
      - "version.json"
      - "release/**"
      - "tools/validate_release_compat.py"
      - ".github/workflows/release-compatibility.yml"
  pull_request:
    paths:
      - "version.json"
      - "release/**"
      - "tools/validate_release_compat.py"
      - ".github/workflows/release-compatibility.yml"

jobs:
  updater-1-3-24-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published pointer against 1.3.24 updater contract
        run: python3 tools/validate_release_compat.py --pointer
