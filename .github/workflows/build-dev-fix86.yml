name: Build DEV fix86 registry device identity
on:
  push:
    branches:
      - dev/fix86-registry-device-identity
    paths:
      - .github/workflows/build-dev-fix86.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fix86-registry-device-identity
      - name: Build DEV fix86
        run: python3 tools/ops_build_fix86.py
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate generated JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,tempfile
          pkg=json.loads(pathlib.Path('dev/builds/1.3.26-dev-registry-device-identity-fix86.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg['files']:
                  if not item['path'].endswith('.js'):
                      continue
                  out=td/item['path'].replace('/','__')
                  out.write_bytes(base64.b64decode(item['content_base64'],validate=True))
                  subprocess.run(['node','--check',str(out)],check=True)
          print('PASS generated DEV JavaScript syntax')
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ops_build_fix86.py dev/self-update.json dev/history.json             dev/builds/1.3.26-dev-registry-device-identity-fix86.json
          git rm .github/workflows/build-dev-fix86.yml
          git commit -m "DEV fix86: persist registry identity per PC"
          git push origin HEAD:dev/fix86-registry-device-identity

# rerun after content-script target fix
