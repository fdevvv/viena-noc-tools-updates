name: Promote modern RELEASE

on:
  workflow_dispatch:
    inputs:
      candidate_path:
        description: "Immutable candidate package under release/"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE to authorize publication"
        required: true
        type: string
      notes:
        description: "Release notes, one per line"
        required: false
        type: string
      minimum:
        description: "Minimum supported modern version"
        required: true
        default: "1.3.25"
        type: string
      mandatory:
        description: "Mandatory update"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-modern-release
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_PATH: ${{ inputs.candidate_path }}
      PROMOTE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_NOTES: ${{ inputs.notes }}
      MINIMUM_VERSION: ${{ inputs.minimum }}
      MANDATORY_UPDATE: ${{ inputs.mandatory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require explicit authorization
        run: |
          test "$PROMOTE_CONFIRMATION" = "PROMOTE" || { echo "Explicit PROMOTE confirmation missing"; exit 1; }

      - name: Prepare staged modern pointer
        run: |
          args=(--candidate "$CANDIDATE_PATH" --minimum "$MINIMUM_VERSION" --notes "$RELEASE_NOTES")
          if [ "$MANDATORY_UPDATE" = "true" ]; then args+=(--mandatory); fi
          python3 tools/prepare_release_pointer.py "${args[@]}"

      - name: Validate frozen legacy bootstrap
        run: python3 tools/validate_bootstrap.py --public

      - name: Validate historical 1.3.25 rescue contract
        run: python3 tools/validate_legacy_rescue.py

      - name: Test historical 1.3.25 rescue integration
        run: python3 tools/test_legacy_rescue.py --require-pwsh

      - name: Validate rescue v4 to v5 repair contract
        run: python3 tools/validate_bootstrap_v4_repair.py

      - name: Test rescue v4 to v5 repair integration
        run: python3 tools/test_bootstrap_v4_repair.py --require-pwsh

      - name: Require legacy quarantine remediation
        run: python3 tools/validate_legacy_rescue.py --require-retired

      - name: Validate modern candidate/pointer
        run: python3 tools/validate_release_compat.py --pointer --pointer-file release/latest.json

      - name: Adversarial validation
        run: python3 tools/test_release_validator.py --pointer-file release/latest.json

      - name: Historical updater matrix
        run: python3 tools/validate_update_matrix.py --pointer-file release/latest.json

      - name: Assert updater safety mechanisms
        run: python3 tools/test_update_safety_contract.py

      - name: Check candidate JavaScript syntax and destructive operations
        shell: python
        run: |
          import base64,json,pathlib,re,subprocess,tempfile
          root=pathlib.Path(".")
          pointer=json.loads((root/"release/latest.json").read_text())
          rel=pointer["package_url"].split("/main/",1)[1]
          pkg=json.loads((root/rel).read_text())
          assert not pkg.get("remove")
          assert not pkg.get("patches")
          dangerous=[re.compile(rb"chrome\.storage\.local\.clear\s*\("),re.compile(rb"indexedDB\.deleteDatabase\s*\(")]
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg["files"]:
                  if not item["path"].endswith(".js"): continue
                  raw=base64.b64decode(item["content_base64"],validate=True)
                  for pattern in dangerous:
                      assert not pattern.search(raw), f"destructive storage operation in {item['path']}"
                  out=td/item["path"].replace("/","__")
                  out.write_bytes(raw)
                  subprocess.run(["node","--check",str(out)],check=True)
          print("PASS candidate JS/destructive scan")

      - name: Verify immutable artifact from remote main
        run: |
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/${CANDIDATE_PATH}?_=$(date +%s)" -o "$tmp"
          local_sha="$(sha256sum "$CANDIDATE_PATH" | awk '{print $1}')"
          remote_sha="$(sha256sum "$tmp" | awk '{print $1}')"
          test "$local_sha" = "$remote_sha" || { echo "Remote artifact SHA mismatch"; exit 1; }

      - name: Ensure bootstrap was not modified
        run: |
          git diff --exit-code -- version.json release/bootstrap.json

      - name: Create protected pointer-only promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release/latest.json
          git diff --cached --quiet && { echo "No pointer change to publish"; exit 1; }

          staged_files="$(git diff --cached --name-only)"
          test "$staged_files" = "release/latest.json" || {
            echo "Promotion must stage release/latest.json only."
            printf '%s\n' "$staged_files"
            exit 1
          }

          release_version="$(python3 - <<'PY'
import json
print(json.load(open("release/latest.json", encoding="utf-8"))["latest"])
PY
)"
          branch="release/promote-${release_version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$branch"
          git commit -m "release: promote modern ${release_version}"
          git push origin "HEAD:$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Release: promote ${release_version}" \
            --body "Pointer-only RELEASE promotion created by the authorized Promote modern RELEASE workflow after all pre-publication gates passed. Merge only after the required Main protection gate is green."
