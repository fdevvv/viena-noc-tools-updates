name: DEV fix68 UI detail polish
on:
  push:
    branches: [dev/ui-detail-polish-fix68]
    paths:
      - tools/ops_build_fix68.py
      - .github/workflows/dev-fix68-ui-detail-polish.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/ui-detail-polish-fix68
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix68.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate all packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-ui-detail-polish-fix68.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: UI acceptance checks
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-ui-detail-polish-fix68.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']) for f in p['files']}
          h=fs['js/97-home-ui.js'].decode(); ph=fs['popup.html'].decode()
          checks={
            'operator popup geometry':'width:480px' in ph and 'minmax(0,1.08fr)' in ph,
            'loading card hidden':"empty.style.display=editorDraft?'none':'grid'" in h,
            'current button name':'nameInput.value=editorDraft.nombre' in h,
            'search icon aligned':'editor-search>span:first-child' in h,
            'reason counts aligned':'grid-template-columns:24px 28px minmax(0,1fr) 76px 26px' in h,
            'template motion':'fix68BaseRenderEditorForm' in h and 'card.animate([' in h,
            'update-card spacing':'min-height:68px' in h,
            'reduced motion':"prefers-reduced-motion: reduce" in h,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-ui-detail-polish-fix68.json dev/self-update.json dev/history.json
          git commit -m "dev: build UI detail polish fix68"
          git push origin HEAD:dev/ui-detail-polish-fix68
