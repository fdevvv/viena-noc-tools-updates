name: Build DEV fix85 manual release ZIP

on:
  push:
    branches:
      - dev/fix85-manual-release-zip
    paths:
      - .github/workflows/build-dev-fix85.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fix85-manual-release-zip
      - name: Build DEV package and stable RELEASE ZIP
        run: python3 tools/ops_build_fix85.py
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JS syntax in generated DEV package
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,tempfile
          pkg=json.loads(pathlib.Path('dev/builds/1.3.26-dev-manual-release-zip-fix85.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg['files']:
                  if not item['path'].endswith('.js'):
                      continue
                  out=td/item['path'].replace('/','__')
                  out.write_bytes(base64.b64decode(item['content_base64'],validate=True))
                  subprocess.run(['node','--check',str(out)],check=True)
          print('PASS generated DEV JavaScript syntax')
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ops_build_fix85.py dev/self-update.json dev/history.json             dev/builds/1.3.26-dev-manual-release-zip-fix85.json             downloads/VIENA_NOC_Tools_RELEASE_v1.3.40.zip
          git rm .github/workflows/build-dev-fix85.yml
          git commit -m "DEV fix85: manual RELEASE ZIP for selected users"
          git push origin HEAD:dev/fix85-manual-release-zip
