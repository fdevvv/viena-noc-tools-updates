name: DEV fix67 final UI cleanup
on:
  push:
    branches: [dev/final-ui-cleanup-fix67]
    paths:
      - tools/ops_build_fix67.py
      - .github/workflows/dev-fix67-final-ui-cleanup.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/final-ui-cleanup-fix67
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix67.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate all packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-final-ui-cleanup-fix67.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Final UI acceptance checks
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,re
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-final-ui-cleanup-fix67.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']) for f in p['files']}
          h=fs['js/97-home-ui.js'].decode();pop=fs['popup.js'].decode();ph=fs['popup.html'].decode()
          checks={
            'three-section full view': all(x in h for x in ['data-section=\\\"general\\\"','data-section=\\\"personalization\\\"','data-section=\\\"updates\\\"']) and 'data-section=\\\"tools\\\"' not in h and 'data-section=\\\"diagnostics\\\"' not in h,
            'no hidden duplicated views':'data-view=\\\"tools\\\"' not in h and 'data-view=\\\"diagnostics\\\"' not in h,
            'shared surname':'viena_asignar_multiple_filtro' in h,
            'responsive':'@media(max-width:760px)' in h and '@media(max-width:560px)' in h,
            'motion':'viena-view-in' in h and 'prefers-reduced-motion:reduce' in h,
            'compact toast':'max-width:min(340px' in h,
            'adjacent folder':'openAdjacentExtensionTab' in h,
            'compact popup':'width:448px' in ph and '"Segoe UI"' in ph,
            'new editor entry':'popup.html?full=1#personalization' in pop and 'VIENA_OPEN_BUTTON_EDITOR' not in pop,
            'editor cleanup':'Buscar entre mis botones' in h,
            'icon top':'personalization-block-label' in h and 'Apariencia' in h,
            'no native dialogs':'alert(' not in h and 'confirm(' not in h,
            'clear editor actions':'editor-main-actions' in h and 'editorIsDirty' in h and 'Descartar cambios' in h
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-final-ui-cleanup-fix67.json dev/self-update.json dev/history.json
          git commit -m "dev: build final UI cleanup fix67"
          git push origin HEAD:dev/final-ui-cleanup-fix67
