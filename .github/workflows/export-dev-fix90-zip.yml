name: Export DEV fix90 ZIP
on:
  push:
    branches: [dev/export-fix90-zip]
    paths:
      - tools/export_dev_fix90_zip.py
      - .github/workflows/export-dev-fix90-zip.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/export-fix90-zip
          fetch-depth: 0
      - name: Build ZIP
        run: python3 tools/export_dev_fix90_zip.py
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/VIENA_NOC_Tools_DEV_fix90.zip
          git commit -m "dev: export fix90 zip"
          git push origin HEAD:dev/export-fix90-zip
