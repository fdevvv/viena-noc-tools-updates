name: DEV fix70 status operator stability
on:
  push:
    branches: [dev/status-operator-stability-fix70]
    paths:
      - tools/ops_build_fix70.py
      - .github/workflows/dev-fix70-status-operator-stability.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/status-operator-stability-fix70
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix70.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-status-operator-stability-fix70.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-status-operator-stability-fix70.json dev/self-update.json dev/history.json
          git commit -m "dev: build status operator stability fix70"
          git push origin HEAD:dev/status-operator-stability-fix70
