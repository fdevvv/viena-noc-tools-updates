name: DEV fix73 page manifest icon
on:
  push:
    branches: [dev/page-manifest-icon-fix73]
    paths:
      - tools/ops_build_fix73.py
      - .github/workflows/dev-fix73-page-manifest-icon.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/page-manifest-icon-fix73
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix73.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-page-manifest-icon-fix73.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate manifest icons
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-page-manifest-icon-fix73.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']) for f in p['files']}
          m=json.loads(fs['manifest.json'])
          assert m['icons']=={'16':'icons/viena-16.png','32':'icons/viena-32.png','48':'icons/viena-48.png','128':'icons/viena-128.png'}
          for s in ('16','32','48','128'):
            b=fs[f'icons/viena-{s}.png']
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert b'id="vienaPageFavicon"' in fs['popup.html']
          assert b'applyPageFavicon(v)' in fs['js/97-home-ui.js']
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-page-manifest-icon-fix73.json dev/self-update.json dev/history.json
          git commit -m "dev: build page manifest icon fix73"
          git push origin HEAD:dev/page-manifest-icon-fix73
