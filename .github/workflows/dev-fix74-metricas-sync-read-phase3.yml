name: DEV fix74 metricas sync read phase3
on:
  push:
    branches: [dev/metricas-sync-read-phase3-fix74]
    paths:
      - tools/ops_build_fix74.py
      - .github/workflows/dev-fix74-metricas-sync-read-phase3.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/metricas-sync-read-phase3-fix74
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix74.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-read-phase3-fix74.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Phase 3 acceptance
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-read-phase3-fix74.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']).decode(errors='replace') for f in p['files'] if f['path'].endswith('.js') or f['path']=='manifest.json'}
          m=fs['js/50-metrics.js']
          manifest=json.loads(fs['manifest.json'])
          block=m[m.index('function procesarFila'):m.index('function procesarTabla')]
          checks={
            'poll 10s':'METRICAS_SYNC_POLL_MS = 10000' in m,
            'GET only':'GET_TODAY_STATES' in m and 'UPSERT_STATE' not in m,
            'colors untouched by shared map':'metricasSyncEstados' not in block,
            'normalization':'normalizarNodoSync' in m,
            'date validation':'fecha !== fechaServidor' in m,
            'host permission':'https://script.google.com/*' in manifest.get('host_permissions',[]) and 'https://script.googleusercontent.com/*' in manifest.get('host_permissions',[]),
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-metricas-sync-read-phase3-fix74.json dev/self-update.json dev/history.json
          git commit -m "dev: build metricas sync read phase3 fix74"
          git push origin HEAD:dev/metricas-sync-read-phase3-fix74
