name: DEV fix92 simplify full-view updates
on:
  push:
    branches: [dev/fullview-general-updates-fix92]
    paths:
      - tools/ops_build_fix92.py
      - .github/workflows/dev-fix92-fullview-general-updates.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fullview-general-updates-fix92
          fetch-depth: 0
      - name: Build DEV fix92
        run: python3 tools/ops_build_fix92.py
      - name: Validate DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-fullview-general-updates-fix92.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate full-view structure
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-fullview-general-updates-fix92.json').read_text())
          files={f['path']:base64.b64decode(f['content_base64']).decode(errors='replace') for f in p['files']}
          h=files['js/97-home-ui.js']
          checks={
            'updates nav removed':'data-section=\\\"updates\\\"' not in h,
            'updates view removed':'data-view=\\\"updates\\\"' not in h,
            'general nav preserved':'data-section=\\\"general\\\"' in h,
            'personalization nav preserved':'data-section=\\\"personalization\\\"' in h,
            'summary installed preserved':'id=\\\"summaryInstalled\\\"' in h,
            'summary available preserved':'id=\\\"summaryAvailable\\\"' in h,
            'summary folder preserved':'id=\\\"summaryFolder\\\"' in h,
            'compat updater DOM preserved':'id=\\\"fullViewUpdateCompat\\\"' in h and 'id=\\\"runUpdateNow\\\"' in h,
            'two-section router':"['general','personalization'].includes(name)" in h,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-fullview-general-updates-fix92.json dev/self-update.json dev/history.json
          git commit -m "dev: simplify full-view updates into General fix92"
          git push origin HEAD:dev/fullview-general-updates-fix92
