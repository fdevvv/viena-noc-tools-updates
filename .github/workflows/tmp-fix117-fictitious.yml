name: FIX117 one-shot generator

on:
  push:
    branches:
      - dev/fix117-fictitious-update-test

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fix117-fictitious-update-test
      - name: Generate FIX117 from FIX116
        run: python3 tools/tmp_make_fix117.py
      - name: Validate generated DEV candidate
        run: python3 tools/validate_dev_matrix.py
      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEV fix117: generate fictitious candidate"
          git push origin HEAD:dev/fix117-fictitious-update-test
