name: DEV fix81 metricas initial global baseline
on:
  push:
    branches: [dev/metricas-sync-initial-baseline-fix81]
    paths:
      - tools/ops_build_fix81.py
      - backend/metricas-sync/Code.gs
      - .github/workflows/dev-fix81-metricas-initial-baseline.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/metricas-sync-initial-baseline-fix81
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix81.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-initial-baseline-fix81.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate first-writer baseline design
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          code=pathlib.Path('backend/metricas-sync/Code.gs').read_text()
          assert "op === 'INIT_STATE'" in code
          assert 'function initStateIfAbsent_' in code
          assert 'LockService.getScriptLock()' in code
          assert 'created:false' in code and 'created:true' in code
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-initial-baseline-fix81.json').read_text())
          m=base64.b64decode(next(f['content_base64'] for f in p['files'] if f['path']=='js/50-metrics.js')).decode(errors='replace')
          checks={
            'client init op':"'INIT_STATE'" in m,
            'first flag hook':'asegurarBaselineInicialCompartido(' in m,
            'existing local baseline migration':'historial[nodo]' in m,
            'retry throttle':'METRICAS_SYNC_INIT_RETRY_MS = 15000' in m,
            'per-node in-flight guard':'metricasSyncInitEnCurso.has(nodoSync)' in m,
            'remote remains authoritative':'metricasSyncEstados.get(nodoSync)' in m,
            'violet after increase':'valores.total > base.total' in m and 'valores.problema > base.problema' in m,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-metricas-sync-initial-baseline-fix81.json dev/self-update.json dev/history.json
          git commit -m "dev: build metricas initial baseline fix81"
          git push origin HEAD:dev/metricas-sync-initial-baseline-fix81
