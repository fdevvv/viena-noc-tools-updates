name: Rebuild DEV fix51 history

on:
  push:
    branches:
      - ops/dev-fix51-release-history-merge
    paths:
      - tools/ops_build_fix51.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/dev-fix51-release-history-merge
          fetch-depth: 0

      - name: Build fix51
        run: python3 tools/ops_build_fix51.py

      - name: Validate DEV
        run: python3 tools/validate_dev_matrix.py

      - name: Commit rebuilt DEV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-release-history-fix51.json dev/self-update.json dev/history.json
          git commit -m "dev: rebuild fix51 release history"
          git push origin HEAD:ops/dev-fix51-release-history-merge
