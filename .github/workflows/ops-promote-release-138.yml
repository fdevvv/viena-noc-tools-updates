name: OPS promote RELEASE 1.3.38

on:
  push:
    branches:
      - release/promote-1.3.38-chatgpt
    paths:
      - .github/workflows/ops-promote-release-138.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/promote-1.3.38-chatgpt
          fetch-depth: 0

      - name: Promote release pointer
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          package_rel = "release/v1.3.38-release-status-history-fix54-candidate1-package.json"
          package_path = pathlib.Path(package_rel)
          raw = package_path.read_bytes()
          pkg = json.loads(raw.decode("utf-8"))
          assert pkg["version"] == "1.3.38"
          assert pkg["build"] == "1.3.38"
          assert pkg["channel"] == "RELEASE"
          latest = {
            "schema": 2,
            "role": "modern-release",
            "latest": "1.3.38",
            "minimum": "1.3.25",
            "mandatory": False,
            "notes": [
              "Se corrigió la detección de la RELEASE vigente para que el estado de actualización coincida con la versión publicada.",
              "El historial visible mantiene únicamente información útil para el operador."
            ],
            "package_url": "https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/" + package_rel,
            "package_sha256": hashlib.sha256(raw).hexdigest(),
            "source_package": package_rel,
            "promotion_gate": "release-update-safety-v2"
          }
          pathlib.Path("release/latest.json").write_text(json.dumps(latest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(latest, ensure_ascii=False, indent=2))
          PY

      - name: Validate promoted pointer
        run: |
          python3 tools/validate_release_compat.py --package release/v1.3.38-release-status-history-fix54-candidate1-package.json
          python3 tools/test_update_safety_contract.py

      - name: Commit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          git commit -m "release: promote modern 1.3.38"
          git push origin HEAD:release/promote-1.3.38-chatgpt
