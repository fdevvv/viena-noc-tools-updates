name: Audit RELEASE 1.3.39 isolation
on:
  push:
    branches: [release/1.3.39-metricas-sync-only]
    paths:
      - tools/audit_release_139_metricas.py
      - .github/workflows/audit-release-139-metricas.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.3.39-metricas-sync-only
      - name: Audit isolated sources
        run: python3 tools/audit_release_139_metricas.py
