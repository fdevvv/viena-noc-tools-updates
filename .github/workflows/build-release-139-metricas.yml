name: Build RELEASE 1.3.39 METRICAS_SYNC only
on:
  push:
    branches: [release/1.3.39-metricas-sync-only]
    paths:
      - tools/prepare_release_139_metricas_sync.py
      - .github/workflows/build-release-139-metricas.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.3.39-metricas-sync-only
          fetch-depth: 0
      - name: Build isolated candidate
        run: python3 tools/prepare_release_139_metricas_sync.py
      - name: Validate RELEASE package contract
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'tools')
          import validate_release_compat as v
          p=pathlib.Path('release/v1.3.39-metricas-sync-global-candidate1-package.json')
          v.validate_package(p)
          pkg=json.loads(p.read_text())
          assert pkg['version']=='1.3.39'
          assert pkg['build']=='1.3.39'
          assert pkg['channel']=='RELEASE'
          assert pkg['mode']=='full'
          assert not pkg.get('remove')
          assert not pkg.get('patches')
          print('PASS release contract')
          PY
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('release/v1.3.39-metricas-sync-global-candidate1-package.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          print('PASS node --check')
          PY
      - name: Validate isolated functional scope
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,hashlib
          def load(p):
            j=json.loads(pathlib.Path(p).read_text())
            return {x['path']:base64.b64decode(x['content_base64']) for x in j['files']}
          base=load('release/v1.3.38-release-status-history-fix54-candidate1-package.json')
          pre=load('dev/builds/1.3.26-dev-page-manifest-icon-fix73.json')
          dev=load('dev/builds/1.3.26-dev-metricas-sync-header-status-fix83.json')
          out=load('release/v1.3.39-metricas-sync-global-candidate1-package.json')
          assert base['js/50-metrics.js']==pre['js/50-metrics.js']
          assert base['js/95-local-updater.js']==dev['js/95-local-updater.js']==out['js/95-local-updater.js']
          assert out['js/50-metrics.js']==dev['js/50-metrics.js']
          allowed={'js/50-metrics.js','manifest.json','build.json','background.js','js/80-update-banner.js','js/90-runtime-status.js','popup.html','popup.js','integrity-manifest.json'}
          changed={p for p in base if base[p]!=out[p]}
          assert changed <= allowed, sorted(changed-allowed)
          print('PASS isolated scope',sorted(changed))
          PY
      - name: Commit immutable candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/v1.3.39-metricas-sync-global-candidate1-package.json downloads/VIENA_NOC_Tools_RELEASE_v1.3.39_candidate1.zip
          git commit -m "release: build isolated 1.3.39 METRICAS_SYNC candidate"
          git push origin HEAD:release/1.3.39-metricas-sync-only
