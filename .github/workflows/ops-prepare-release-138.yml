name: OPS prepare RELEASE 1.3.38

on:
  push:
    branches:
      - ops/prepare-release-1.3.38
    paths:
      - .github/workflows/ops-prepare-release-138.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/prepare-release-1.3.38
          fetch-depth: 0

      - name: Resolve DEV package
        id: dev
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("dev/self-update.json", encoding="utf-8"))
          u=p["package_url"]
          print("package="+u.split("/refs/heads/main/",1)[1])
          PY

      - name: Build RELEASE 1.3.38 candidate 1
        id: build
        run: |
          python3 tools/prepare_release_candidate.py \
            --dev-package "${{ steps.dev.outputs.package }}" \
            --version "1.3.38" \
            --candidate 1 > /tmp/result.json
          cat /tmp/result.json

      - name: Validate candidate
        run: |
          candidate="$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["candidate"])')"
          python3 tools/validate_release_compat.py --package "$candidate"

      - name: Commit candidate artifacts
        run: |
          candidate="$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["candidate"])')"
          zip_path="$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["zip"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" "$zip_path"
          git commit -m "release: prepare 1.3.38 candidate 1"
          git push origin HEAD:ops/prepare-release-1.3.38
