name: OPS Promote RELEASE 1.3.35

on:
  push:
    branches:
      - ops/release-1.3.35-promote

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Prepare staged modern pointer
        run: |
          python3 tools/prepare_release_pointer.py             --candidate "release/v1.3.35-mira-cuadras-modal-transitions-fix49-candidate1-package.json"             --minimum "1.3.25"             --notes $'Vista previa de cuadras incorpora fallas rápidas y templates editables para completar FALLA DETECTADA.\nLas cuadras se muestran un rango por línea y los templates se insertan al final de FALLA DETECTADA sin alterar ESTADO DE FUENTE.'

      - name: Validate frozen legacy bootstrap
        run: python3 tools/validate_bootstrap.py --public
      - name: Validate historical 1.3.25 rescue contract
        run: python3 tools/validate_legacy_rescue.py
      - name: Test historical 1.3.25 rescue integration
        run: python3 tools/test_legacy_rescue.py --require-pwsh
      - name: Validate rescue v4 to v5 repair contract
        run: python3 tools/validate_bootstrap_v4_repair.py
      - name: Test rescue v4 to v5 repair integration
        run: python3 tools/test_bootstrap_v4_repair.py --require-pwsh
      - name: Require legacy quarantine remediation
        run: python3 tools/validate_legacy_rescue.py --require-retired
      - name: Validate modern candidate/pointer
        run: python3 tools/validate_release_compat.py --pointer --pointer-file release/latest.json
      - name: Adversarial validation
        run: python3 tools/test_release_validator.py --pointer-file release/latest.json
      - name: Historical updater matrix
        run: python3 tools/validate_update_matrix.py --pointer-file release/latest.json
      - name: Assert updater safety mechanisms
        run: python3 tools/test_update_safety_contract.py
      - name: Check candidate JavaScript syntax and destructive operations
        shell: python
        run: |
          import base64,json,pathlib,re,subprocess,tempfile
          root=pathlib.Path(".")
          pointer=json.loads((root/"release/latest.json").read_text())
          rel=pointer["package_url"].split("/main/",1)[1]
          pkg=json.loads((root/rel).read_text())
          assert not pkg.get("remove")
          assert not pkg.get("patches")
          dangerous=[re.compile(rb"chrome\.storage\.local\.clear\s*\("),re.compile(rb"indexedDB\.deleteDatabase\s*\(")]
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg["files"]:
                  if not item["path"].endswith(".js"): continue
                  raw=base64.b64decode(item["content_base64"],validate=True)
                  for pattern in dangerous:
                      assert not pattern.search(raw), f"destructive storage operation in {item['path']}"
                  out=td/item["path"].replace("/","__")
                  out.write_bytes(raw)
                  subprocess.run(["node","--check",str(out)],check=True)
          print("PASS candidate JS/destructive scan")

      - name: Ensure bootstrap was not modified
        run: git diff --exit-code -- version.json release/bootstrap.json

      - name: Create pointer-only promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          test "$(git diff --cached --name-only)" = "release/latest.json"
          branch="release/promote-1.3.35-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "release: promote modern 1.3.35"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "Release: promote 1.3.35" --body "Pointer-only RELEASE promotion for 1.3.35 after full compatibility, historical updater, rescue, JavaScript syntax and destructive-operation checks. This PR modifies only release/latest.json."
