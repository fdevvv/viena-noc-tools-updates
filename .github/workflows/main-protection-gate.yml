name: Main protection gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  main-protection-gate:
    name: Main protection gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce protected pointer policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sed '/^$/d' > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt

          if grep -Fxq 'version.json' /tmp/changed-files.txt; then
            echo 'version.json is the frozen legacy bootstrap pointer and must not change.'
            exit 1
          fi

          if grep -Fxq 'release/latest.json' /tmp/changed-files.txt; then
            case "$HEAD_REF" in
              release/promote-*) ;;
              *)
                echo 'release/latest.json may only change through the protected promotion workflow.'
                exit 1
                ;;
            esac

            changed_count="$(wc -l < /tmp/changed-files.txt | tr -d ' ')"
            if [ "$changed_count" -ne 1 ]; then
              echo 'A RELEASE promotion PR must change release/latest.json only.'
              exit 1
            fi
          fi

      - name: Validate frozen legacy bootstrap
        run: python3 tools/validate_bootstrap.py --public

      - name: Validate changed immutable RELEASE packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: python3 tools/validate_changed_release_packages.py

      - name: Validate DEV historical updater matrix
        run: python3 tools/validate_dev_matrix.py

      - name: Validate modern RELEASE pointer/package
        run: python3 tools/validate_release_compat.py --pointer --pointer-file release/latest.json

      - name: Run RELEASE adversarial validation
        run: python3 tools/test_release_validator.py --pointer-file release/latest.json

      - name: Execute modern historical updater matrix
        run: python3 tools/validate_update_matrix.py --pointer-file release/latest.json

      - name: Require retired historical quarantine and validate rescue contract
        run: python3 tools/validate_legacy_rescue.py --require-retired

      - name: Execute historical 1.3.25 rescue integration
        run: python3 tools/test_legacy_rescue.py --require-pwsh

      - name: Validate bootstrap v4 to v5 repair contract
        run: python3 tools/validate_bootstrap_v4_repair.py

      - name: Execute bootstrap v4 to v5 repair integration
        run: python3 tools/test_bootstrap_v4_repair.py --require-pwsh

      - name: Assert updater safety mechanisms
        run: python3 tools/test_update_safety_contract.py

      - name: Check current bootstrap, DEV and RELEASE JavaScript
        shell: python
        run: |
          import base64, json, pathlib, re, subprocess, tempfile

          root = pathlib.Path('.')

          def package_path_from_url(url):
              for marker in ('/refs/heads/main/', '/main/'):
                  if marker in url:
                      return url.split(marker, 1)[1]
              raise AssertionError(f'Unsupported package URL: {url}')

          bootstrap = json.loads((root / 'release/bootstrap.json').read_text())
          dev_pointer = json.loads((root / 'dev/self-update.json').read_text())
          release_pointer = json.loads((root / 'release/latest.json').read_text())

          packages = [
              ('bootstrap', root / bootstrap['package_path'], False),
              ('dev', root / package_path_from_url(dev_pointer['package_url']), False),
              ('release', root / package_path_from_url(release_pointer['package_url']), True),
          ]

          dangerous = [
              re.compile(rb'chrome\.storage\.local\.clear\s*\('),
              re.compile(rb'indexedDB\.deleteDatabase\s*\('),
          ]

          with tempfile.TemporaryDirectory() as td:
              td = pathlib.Path(td)
              for label, path, release_strict in packages:
                  pkg = json.loads(path.read_text())
                  if release_strict:
                      assert not pkg.get('remove'), 'RELEASE package must not remove files'
                      assert not pkg.get('patches'), 'RELEASE package must not contain text patches'

                  for item in pkg['files']:
                      if not item['path'].endswith('.js'):
                          continue
                      raw = base64.b64decode(item['content_base64'], validate=True)
                      if release_strict:
                          for pattern in dangerous:
                              assert not pattern.search(raw), f"destructive storage operation in {item['path']}"
                      out = td / f"{label}__{item['path'].replace('/', '__')}"
                      out.write_bytes(raw)
                      subprocess.run(['node', '--check', str(out)], check=True)

          print('PASS aggregate JavaScript/destructive-operation gate')
