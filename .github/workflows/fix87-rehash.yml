name: Repair DEV fix87 integrity

on:
  push:
    branches:
      - dev/fix87-update-ui-manual-zip
    paths:
      - .github/workflows/fix87-rehash.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fix87-update-ui-manual-zip
      - name: Repair full-view JavaScript source
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          package_path = pathlib.Path('dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json')
          pkg = json.loads(package_path.read_text(encoding='utf-8'))
          item = next(x for x in pkg['files'] if x['path'] == 'js/97-home-ui.js')
          src = base64.b64decode(item['content_base64'], validate=True).decode('utf-8')
          bad = "    let buildInfo=null;\\n    let lastOperationalStatus=null;\\n    let toastTimer=0;\\n    let fullUpdateTarget=null;\\n    let fullFolderStatus=null;\\n    let fullFolderHandle=null;"
          good = "    let buildInfo=null;\n    let lastOperationalStatus=null;\n    let toastTimer=0;\n    let fullUpdateTarget=null;\n    let fullFolderStatus=null;\n    let fullFolderHandle=null;"
          if bad not in src:
              raise SystemExit('target literal-newline block not found')
          src = src.replace(bad, good, 1)
          raw = src.encode('utf-8')
          item['content_base64'] = base64.b64encode(raw).decode('ascii')
          item['size'] = len(raw)
          package_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('repaired js/97-home-ui.js')
          PY
      - name: Rebuild package integrity and pointer SHA
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          package_path = pathlib.Path('dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json')
          ptr_path = pathlib.Path('dev/self-update.json')
          pkg = json.loads(package_path.read_text(encoding='utf-8'))
          items = {item['path']: item for item in pkg['files']}
          decoded = {}
          for path,item in items.items():
              decoded[path] = base64.b64decode(item['content_base64'], validate=True)
          for path,data in decoded.items():
              if path == 'integrity-manifest.json':
                  continue
              items[path]['size'] = len(data)
              items[path]['sha256'] = hashlib.sha256(data).hexdigest()
          integ = json.loads(decoded['integrity-manifest.json'].decode('utf-8'))
          integ['build'] = pkg['build']
          integ['files'] = {
              path: hashlib.sha256(data).hexdigest()
              for path,data in decoded.items()
              if path != 'integrity-manifest.json'
          }
          integ_raw = (json.dumps(integ, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          items['integrity-manifest.json']['size'] = len(integ_raw)
          items['integrity-manifest.json']['sha256'] = hashlib.sha256(integ_raw).hexdigest()
          items['integrity-manifest.json']['content_base64'] = base64.b64encode(integ_raw).decode('ascii')
          package_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          package_sha = hashlib.sha256(package_path.read_bytes()).hexdigest()
          ptr = json.loads(ptr_path.read_text(encoding='utf-8'))
          ptr['package_sha256'] = package_sha
          ptr_path.write_text(json.dumps(ptr, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('package_sha256', package_sha)
          PY
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JavaScript syntax in package
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,tempfile
          pkg=json.loads(pathlib.Path('dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg['files']:
                  if not item['path'].endswith('.js'):
                      continue
                  out=td/item['path'].replace('/','__')
                  out.write_bytes(base64.b64decode(item['content_base64'],validate=True))
                  subprocess.run(['node','--check',str(out)],check=True)
          print('PASS JavaScript syntax')
          PY
      - name: Commit repaired artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/self-update.json dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json
          git rm .github/workflows/fix87-rehash.yml
          git commit -m "DEV fix87: repair package integrity"
          git push origin HEAD:dev/fix87-update-ui-manual-zip
