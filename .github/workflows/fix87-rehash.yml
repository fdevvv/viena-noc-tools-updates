name: Rebuild DEV fix87 cleanly

on:
  push:
    branches:
      - dev/fix87-update-ui-manual-zip
    paths:
      - .github/workflows/fix87-rehash.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fix87-update-ui-manual-zip
      - name: Rebuild fix87 from clean fix86
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          from datetime import datetime, timezone

          R=pathlib.Path('.')
          src=R/'dev/builds/1.3.26-dev-registry-device-identity-fix86.json'
          dst=R/'dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json'
          old='1.3.26-dev-registry-device-identity-fix86'
          new='1.3.26-dev-update-ui-manual-zip-fix87'

          def h(b): return hashlib.sha256(b).hexdigest()

          pkg=json.loads(src.read_text(encoding='utf-8'))
          files={}
          order=[]
          for item in pkg['files']:
              raw=base64.b64decode(item['content_base64'],validate=True)
              assert h(raw)==item['sha256']
              files[item['path']]=raw
              order.append(item['path'])

          # Popup layout
          html=files['popup.html'].decode('utf-8')
          old_actions='<div class="action-row" style="margin-top:8px"><button id="checkUpdate" type="button" class="btn secondary">Buscar actualización DEV</button><button id="openUpdate" type="button" class="btn" style="display:none">Actualizar</button><button id="manualReleaseZip" type="button" style="display:none" title="Descarga la RELEASE vigente para instalación manual">Descargar ZIP manual</button></div>'
          new_actions='<div class="update-actions-grid"><button id="checkUpdate" type="button" class="btn secondary">Buscar actualización DEV</button><button id="openUpdate" type="button" class="btn primary" style="display:none">Actualizar</button><button id="manualReleaseZip" type="button" class="btn secondary manual-zip-action" style="display:none" title="Descarga la RELEASE vigente para instalación manual">Descargar ZIP manual</button></div>'
          assert old_actions in html
          html=html.replace(old_actions,new_actions,1)
          css='.update-actions-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:8px}.update-actions-grid .btn{width:100%;min-width:0;min-height:40px;padding:8px 7px;white-space:normal;line-height:1.22;text-align:center}.update-actions-grid .manual-zip-action{grid-column:1/-1}@media(max-width:360px){.update-actions-grid{grid-template-columns:1fr}.update-actions-grid .manual-zip-action{grid-column:auto}}\n'
          assert '.update-confirm-overlay{position:fixed;' in html
          html=html.replace('.update-confirm-overlay{position:fixed;',css+'.update-confirm-overlay{position:fixed;',1)
          files['popup.html']=html.encode('utf-8')

          # Popup manual ZIP uses release/latest.json and extension-page-only opener
          popup=files['popup.js'].decode('utf-8')
          dev_const="const VIENA_DEV_LOCAL_UPDATE_MANIFEST_URL = 'https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/dev/self-update.json';"
          assert dev_const in popup
          popup=popup.replace(dev_const,dev_const+"\nconst VIENA_RELEASE_MANIFEST_URL = 'https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/release/latest.json';",1)
          old_fetch="const url = `${VIENA_UPDATE_MANIFEST_URL}${VIENA_UPDATE_MANIFEST_URL.includes('?') ? '&' : '?'}_manual_zip=${Date.now()}`;"
          new_fetch="const url = `${VIENA_RELEASE_MANIFEST_URL}?_manual_zip=${Date.now()}`;"
          assert old_fetch in popup
          popup=popup.replace(old_fetch,new_fetch,1)
          old_msg="const result = await chrome.runtime.sendMessage({ type: 'VIENA_UPDATE_OPEN_DOWNLOAD', url: target.url });"
          new_msg="const result = await chrome.runtime.sendMessage({ type: 'VIENA_OPEN_MANUAL_RELEASE_ZIP', url: target.url, version: target.latest });"
          assert old_msg in popup
          popup=popup.replace(old_msg,new_msg,1)
          old_err="if (result && result.ok === false) throw new Error(result.error || 'No se pudo abrir la descarga.');"
          new_err="if (!result?.ok) throw new Error(result?.detail || result?.error || 'No se pudo abrir la descarga.');"
          assert old_err in popup
          popup=popup.replace(old_err,new_err,1)
          files['popup.js']=popup.encode('utf-8')

          # Background trusted manual-release ZIP handler
          bg=files['background.js'].decode('utf-8')
          anchor="  if(msg?.type==='VIENA_UPDATE_OPEN_DOWNLOAD'){"
          assert anchor in bg
          handler=r"""  if(msg?.type==='VIENA_OPEN_MANUAL_RELEASE_ZIP'){
            if(!senderIsExtensionPage(_sender)){ rejectUnauthorized(sendResponse); return; }
            (async()=>{
              const url=String(msg.url||'').trim(), version=String(msg.version||'').trim();
              if(!/^\d+\.\d+\.\d+$/.test(version)) return {ok:false,detail:'Versión manual inválida'};
              let parsed; try{parsed=new URL(url)}catch(_){return {ok:false,detail:'URL manual inválida'};}
              const expectedPath=`/fdevvv/viena-noc-tools-updates/refs/heads/main/downloads/VIENA_NOC_Tools_RELEASE_v${version}.zip`;
              if(parsed.protocol!=='https:'||parsed.hostname!=='raw.githubusercontent.com'||parsed.pathname!==expectedPath) return {ok:false,detail:'ZIP manual no autorizado'};
              const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
              try{
                const response=await fetch(`https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/release/latest.json?_manual_verify=${Date.now()}`,{cache:'no-store',signal:controller.signal,headers:{'Cache-Control':'no-cache'}});
                if(!response.ok)return {ok:false,detail:`No se pudo validar la RELEASE (HTTP ${response.status})`};
                const data=await response.json(),latest=String(data?.latest||'').trim();
                if(latest!==version)return {ok:false,detail:`La RELEASE vigente es ${latest||'desconocida'}, no ${version}`};
              }finally{clearTimeout(timer)}
              await chrome.tabs.create({url});
              return {ok:true};
            })().then(sendResponse).catch(e=>sendResponse({ok:false,detail:String(e?.message||e)}));
            return true;
          }

          """
          bg=bg.replace(anchor,handler+anchor,1)
          files['background.js']=bg.encode('utf-8')

          # Full-tab update actions
          home=files['js/97-home-ui.js'].decode('utf-8')
          marker='<div id=\\"updateMessage\\" class=\\"info-line\\">Comprobando estado\\u2026</div>'
          assert marker in home
          home=home.replace(marker,marker+'<div class=\\"full-update-actions\\"><button id=\\"runUpdateNow\\" class=\\"btn primary\\" hidden>Actualizar</button><button id=\\"manualReleaseZipFull\\" class=\\"btn secondary\\" hidden>Descargar ZIP manual</button></div><div id=\\"fullUpdateProgress\\" class=\\"minor-status\\"></div>',1)
          assert '>Administrar carpeta</button>' in home
          home=home.replace('>Administrar carpeta</button>','>Vincular / cambiar carpeta</button>',1)
          css_anchor='/* fix68 — editor/update detail polish */'
          assert css_anchor in home
          full_css='.full-update-actions{display:flex;gap:8px;align-items:stretch;margin-top:10px}.full-update-actions .btn{flex:1;min-height:40px}.view[data-view=\\"updates\\"] #fullUpdateProgress{min-height:0;margin-top:8px}@media(max-width:760px){.full-update-actions{flex-direction:column}}\\n\\n'
          home=home.replace(css_anchor,full_css+css_anchor,1)
          vars_anchor='    let toastTimer=0;\n'
          assert vars_anchor in home
          home=home.replace(vars_anchor,vars_anchor+"    let fullUpdateTarget=null;\n    let fullFolderStatus=null;\n    let fullFolderHandle=null;\n",1)

          rf=home.index('    async function refreshFolder(){')
          ra=home.index('    async function refreshAll(){',rf)
          assert rf>=0 and ra>rf
          refresh_block=r"""    async function refreshFolder(){const updater=window.VienaLocalUpdater;let label='No disponible',ok=false;fullFolderStatus=null;fullFolderHandle=null;try{if(updater?.supported()){const st=await updater.getLinkStatus();fullFolderStatus=st;try{fullFolderHandle=await updater.getStoredHandleForUi?.()}catch(_){}ok=Boolean(st?.linked&&st?.valid);label=ok?(String(st?.name||'')||'Vinculada'):(st?.linked?'Requiere autorización':'Sin vincular')}}catch(_){label='Error al comprobar'}$('summaryFolder').textContent=`Carpeta vinculada: ${label}`;$('folderDetail').textContent=label;$('folderBadge').textContent=ok?'Vinculada':'Revisar';$('folderBadge').className='status '+(ok?'ok':'warn')}
          
          async function refreshUpdates(){const url=isDev()?DEV_MANIFEST:RELEASE_MANIFEST,btn=$('runUpdateNow');fullUpdateTarget=null;if(btn){btn.hidden=true;btn.disabled=false}try{const data=await fetch(`${url}?t=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});const availableVersion=String(data.version||data.latest||manifest.version),availableBuild=String(data.build||data.latestBuild||''),currentBuild=String(buildInfo?.build||''),currentVersion=String(manifest.version||''),newer=isDev()?Boolean(availableBuild&&availableBuild!==currentBuild):availableVersion!==currentVersion,label=isDev()?(availableBuild||`v${availableVersion}`):`v${availableVersion}`;$('summaryAvailable').textContent=label;$('updatesAvailable').textContent=label;$('updateStateBadge').textContent=newer?'Disponible':'Actualizada';$('updateStateBadge').className='status '+(newer?'warn':'ok');$('updateMessage').textContent=newer?'Hay una actualización disponible para el canal activo.':'Estás usando el último build publicado del canal activo.';const packageUrl=String(data.package_url||data.packageUrl||''),packageSha256=String(data.package_sha256||data.packageSha256||'').toLowerCase();if(newer&&/^https:\/\/raw\.githubusercontent\.com\//.test(packageUrl)&&/^[a-f0-9]{64}$/.test(packageSha256)){fullUpdateTarget={packageUrl,packageSha256,version:availableVersion,build:availableBuild,channel:isDev()?'DEV':'RELEASE'};if(btn){btn.hidden=false;btn.textContent=isDev()?`Actualizar DEV · ${availableBuild}`:`Actualizar a v${availableVersion}`}}}catch(e){$('summaryAvailable').textContent='Sin datos';$('updatesAvailable').textContent='Sin datos';$('updateStateBadge').textContent='Error';$('updateStateBadge').className='status error';$('updateMessage').textContent='No se pudo consultar el estado de actualización.'}}
          
          """
          home=home[:rf]+refresh_block+home[ra:]
          old_refresh="    async function refreshAll(){await Promise.allSettled([refreshOperational(),refreshOperator(),refreshFolder(),refreshUpdates()])}"
          assert old_refresh in home
          home=home.replace(old_refresh,"    async function refreshAll(){await Promise.allSettled([refreshOperational(),refreshOperator(),refreshFolder(),refreshUpdates(),refreshManualZipFull()])}",1)

          bs=home.index('    async function openAdjacentExtensionTab(url)')
          be=home.index('    let buttonEditorState=null;',bs)
          assert bs>=0 and be>bs
          actions=r"""    async function resolveManualReleaseZipFull(){const local=await chrome.storage.local.get(['viena_usuario']);const user=String(local?.viena_usuario||'').trim().toLowerCase(),allowed=isDev()?user==='efoschi':user==='mbruno';if(!allowed)return null;const data=await fetch(`${RELEASE_MANIFEST}?_manual_zip=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});const latest=String(data?.latest||'').trim();if(!/^\d+\.\d+\.\d+$/.test(latest))throw new Error('RELEASE latest inválida');return {version:latest,url:`https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/downloads/VIENA_NOC_Tools_RELEASE_v${latest}.zip`}}
          async function refreshManualZipFull(){const btn=$('manualReleaseZipFull');if(!btn)return;btn.hidden=true;try{const target=await resolveManualReleaseZipFull();if(!target)return;btn.textContent=`Descargar ZIP manual · v${target.version}`;btn.hidden=false}catch(_){}}
          async function ensureFullFolderReady(){const updater=window.VienaLocalUpdater;if(!updater?.supported())throw new Error('File System Access no está disponible en este Chrome.');const st=fullFolderStatus;if(st?.linked&&st?.permission==='granted'&&st?.valid)return true;if(st?.linked&&st?.permission!=='relink'&&fullFolderHandle){await updater.authorizeStoredHandleFromGesture(fullFolderHandle);await refreshFolder();return true}await updater.pickAndLink({requireRuntimeMatch:false});await refreshFolder();return true}
          async function runFullUpdate(){const btn=$('runUpdateNow'),progress=$('fullUpdateProgress');if(!fullUpdateTarget||!btn)return;btn.disabled=true;if(progress)progress.textContent='Preparando actualización…';try{await ensureFullFolderReady();const accepted=await chrome.runtime.sendMessage({type:'VIENA_BACKGROUND_UPDATE_START',request:{packageUrl:fullUpdateTarget.packageUrl,packageSha256:fullUpdateTarget.packageSha256,expectedVersion:fullUpdateTarget.version,expectedBuild:fullUpdateTarget.build||'',expectedChannel:fullUpdateTarget.channel}});if(!accepted?.ok)throw new Error(accepted?.error||'No se pudo iniciar la actualización.');btn.textContent='Actualización en curso…';if(progress)progress.textContent='Actualización iniciada. La pestaña puede permanecer abierta mientras se reemplazan los archivos.';showToast('Actualización iniciada.','success')}catch(e){btn.disabled=false;if(progress)progress.textContent=String(e?.message||e);showToast(String(e?.message||e),'error')}}
          async function manageFullFolder(){const btn=$('openFolderManager');if(btn)btn.disabled=true;try{const updater=window.VienaLocalUpdater;if(!updater?.supported())throw new Error('File System Access no está disponible en este Chrome.');await updater.pickAndLink({requireRuntimeMatch:false});await refreshFolder();showToast('Carpeta vinculada correctamente.','success')}catch(e){if(e?.name!=='AbortError')showToast(String(e?.message||e),'error')}finally{if(btn)btn.disabled=false}}
          async function openManualZipFull(){const btn=$('manualReleaseZipFull');if(!btn)return;btn.disabled=true;try{const target=await resolveManualReleaseZipFull();if(!target){btn.hidden=true;return}const result=await chrome.runtime.sendMessage({type:'VIENA_OPEN_MANUAL_RELEASE_ZIP',url:target.url,version:target.version});if(!result?.ok)throw new Error(result?.detail||'No se pudo abrir el ZIP manual.');showToast(`Abriendo ZIP manual de la RELEASE ${target.version}.`,'success')}catch(e){showToast(String(e?.message||e),'error')}finally{btn.disabled=false}}
          $('refreshAll').addEventListener('click',refreshAll);$('checkUpdates').addEventListener('click',async()=>{await refreshUpdates();await refreshManualZipFull()});$('openFolderManager').addEventListener('click',manageFullFolder);$('runUpdateNow').addEventListener('click',runFullUpdate);$('manualReleaseZipFull').addEventListener('click',openManualZipFull);
          
          """
          home=home[:bs]+actions+home[be:]
          files['js/97-home-ui.js']=home.encode('utf-8')

          for path in ('background.js','js/80-update-banner.js','js/90-runtime-status.js'):
              text=files[path].decode('utf-8')
              assert old in text
              files[path]=text.replace(old,new,1).encode('utf-8')

          build=json.loads(files['build.json'].decode('utf-8'))
          build['build']=new
          files['build.json']=(json.dumps(build,ensure_ascii=False,indent=2)+'\n').encode('utf-8')

          integ=json.loads(files['integrity-manifest.json'].decode('utf-8'))
          integ['build']=new
          integ['files']={p:h(b) for p,b in files.items() if p!='integrity-manifest.json'}
          files['integrity-manifest.json']=(json.dumps(integ,ensure_ascii=False,indent=2)+'\n').encode('utf-8')

          pkg['build']=new
          pkg['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          pkg['files']=[]
          for path in order:
              raw=files[path]
              pkg['files'].append({'path':path,'size':len(raw),'sha256':h(raw),'content_base64':base64.b64encode(raw).decode('ascii')})
          raw=(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          dst.write_bytes(raw)

          ptr_path=R/'dev/self-update.json'
          ptr=json.loads(ptr_path.read_text(encoding='utf-8'))
          ptr['build']=new
          ptr['package_url']='https://raw.githubusercontent.com/fdevvv/viena-noc-tools-updates/refs/heads/main/dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json'
          ptr['package_sha256']=h(raw)
          ptr['notes']=[
              'Se corrige la distribución de los botones de actualización del popup.',
              'La descarga ZIP manual consulta la RELEASE vigente y usa una apertura segura desde páginas de la extensión.',
              'La vista completa incorpora actualización directa, gestión de carpeta y descarga ZIP manual para el usuario habilitado.'
          ]
          ptr_path.write_text(json.dumps(ptr,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          hist_path=R/'dev/history.json'
          hist=json.loads(hist_path.read_text(encoding='utf-8'))
          hist['current_build']=new
          hist['current_package']='dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json'
          hist_path.write_text(json.dumps(hist,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('package_sha256',h(raw))
          PY
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,tempfile
          pkg=json.loads(pathlib.Path('dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json').read_text(encoding='utf-8'))
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              for item in pkg['files']:
                  if item['path'].endswith('.js'):
                      out=td/item['path'].replace('/','__')
                      out.write_bytes(base64.b64decode(item['content_base64'],validate=True))
                      subprocess.run(['node','--check',str(out)],check=True)
          print('PASS JavaScript syntax')
          PY
      - name: Commit clean fix87
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/self-update.json dev/history.json dev/builds/1.3.26-dev-update-ui-manual-zip-fix87.json
          git rm .github/workflows/fix87-rehash.yml
          git commit -m "DEV fix87: rebuild update UI from clean fix86"
          git push origin HEAD:dev/fix87-update-ui-manual-zip
