name: DEV fix83 metricas header sync status
on:
  push:
    branches: [dev/metricas-sync-header-status-fix83]
    paths:
      - tools/ops_build_fix83.py
      - .github/workflows/dev-fix83-metricas-header-status.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/metricas-sync-header-status-fix83
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix83.py
      - name: Validate DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-header-status-fix83.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate METRICAS_SYNC header status only
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-header-status-fix83.json').read_text())
          m=base64.b64decode(next(f['content_base64'] for f in p['files'] if f['path']=='js/50-metrics.js')).decode(errors='replace')
          checks={
            'status centered':"'left:50%'" in m and "'top:14px'" in m and "'transform:translateX(-50%)'" in m,
            'old bottom status removed':"'bottom:14px'" not in m,
            'sync labels preserved':'● Sincronizado' in m and '↻ Sincronizando' in m and '○ Modo local' in m,
            'init state preserved':"'INIT_STATE'" in m,
            'manual recognition preserved':"'UPSERT_STATE'" in m,
            'violet logic preserved':'valores.total > base.total' in m and 'valores.problema > base.problema' in m,
            'flag replacement guard preserved':'METRICAS_FLAG_REPLACEMENT_GRACE_MS = 12000' in m,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-metricas-sync-header-status-fix83.json dev/self-update.json dev/history.json
          git commit -m "dev: build metricas header sync status fix83"
          git push origin HEAD:dev/metricas-sync-header-status-fix83
