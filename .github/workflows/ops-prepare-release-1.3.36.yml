name: OPS prepare RELEASE 1.3.36

on:
  push:
    branches:
      - ops/prepare-release-1.3.36

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/prepare-release-1.3.36
          fetch-depth: 0

      - name: Build RELEASE 1.3.36 candidate 1
        id: build
        env:
          RELEASE_VERSION: "1.3.36"
          CANDIDATE_NUMBER: "1"
        run: |
          set -euo pipefail
          DEV_PACKAGE="$(python3 - <<'PY'
          import json
          p=json.load(open("dev/self-update.json",encoding="utf-8"))
          url=p["package_url"]
          for marker in ("/refs/heads/main/","/main/"):
              if marker in url:
                  print(url.split(marker,1)[1])
                  break
          else:
              raise SystemExit("Unsupported DEV package_url")
          PY
          )"
          result="$(python3 tools/prepare_release_candidate.py --dev-package "$DEV_PACKAGE" --version "$RELEASE_VERSION" --candidate "$CANDIDATE_NUMBER")"
          printf '%s\n' "$result"
          candidate="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["candidate"])')"
          zip_path="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["zip"])')"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Validate RELEASE candidate
        env:
          CANDIDATE: ${{ steps.build.outputs.candidate }}
        run: |
          python3 tools/validate_release_compat.py --package "$CANDIDATE"
          git diff --exit-code -- version.json release/latest.json

      - name: Commit immutable candidate
        env:
          CANDIDATE: ${{ steps.build.outputs.candidate }}
          ZIP_PATH: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CANDIDATE" "$ZIP_PATH"
          staged="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 2
          git switch -c release/candidate-1.3.36-c1
          git commit -m "release: prepare 1.3.36 candidate 1"
          git push origin HEAD:release/candidate-1.3.36-c1
