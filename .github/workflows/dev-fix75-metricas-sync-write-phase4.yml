name: DEV fix75 metricas sync write phase4
on:
  push:
    branches: [dev/metricas-sync-write-phase4-fix75]
    paths:
      - tools/ops_build_fix75.py
      - .github/workflows/dev-fix75-metricas-sync-write-phase4.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/metricas-sync-write-phase4-fix75
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix75.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-write-phase4-fix75.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Phase 4 acceptance
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-write-phase4-fix75.json').read_text())
          m=base64.b64decode(next(f['content_base64'] for f in p['files'] if f['path']=='js/50-metrics.js')).decode()
          a=m.index('// CTRL + DOBLE CLICK'); b=m.index('// EJECUCIÓN')
          d=m[a:b]
          assert "'UPSERT_STATE'" in m
          assert 'void guardarEstadoCompartido' in d
          assert d.index('guardarHistorial(') < d.index('void guardarEstadoCompartido')
          row=m[m.index('function procesarFila'):m.index('function procesarTabla')]
          assert 'metricasSyncEstados' not in row
          print('PASS phase4 write-only integration')
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-metricas-sync-write-phase4-fix75.json dev/self-update.json dev/history.json
          git commit -m "dev: build metricas sync write phase4 fix75"
          git push origin HEAD:dev/metricas-sync-write-phase4-fix75
