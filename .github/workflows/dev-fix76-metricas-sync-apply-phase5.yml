name: DEV fix76 metricas sync apply phase5
on:
  push:
    branches: [dev/metricas-sync-apply-phase5-fix76]
    paths:
      - tools/ops_build_fix76.py
      - .github/workflows/dev-fix76-metricas-sync-apply-phase5.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/metricas-sync-apply-phase5-fix76
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix76.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-apply-phase5-fix76.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Phase 5 acceptance
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-metricas-sync-apply-phase5-fix76.json').read_text())
          m=base64.b64decode(next(f['content_base64'] for f in p['files'] if f['path']=='js/50-metrics.js')).decode(errors='replace')
          row=m[m.index('function procesarFila'):m.index('function procesarTabla')]
          checks={
            'shared lookup':'metricasSyncEstados.get(nodoSync)' in row,
            'global total':'estadoCompartido.total_marcado' in row,
            'global problem':'estadoCompartido.problema_marcado' in row,
            'local fallback':'if (!historial[nodo])' in row,
            'same color engine':'aplicarColorFila' in row,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-metricas-sync-apply-phase5-fix76.json dev/self-update.json dev/history.json
          git commit -m "dev: build metricas sync apply phase5 fix76"
          git push origin HEAD:dev/metricas-sync-apply-phase5-fix76
