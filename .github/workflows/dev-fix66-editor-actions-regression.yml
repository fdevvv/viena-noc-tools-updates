name: DEV fix66 editor actions regression
on:
  push:
    branches: [dev/editor-actions-regression-fix66]
    paths:
      - tools/ops_build_fix66.py
      - .github/workflows/dev-fix66-editor-actions-regression.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/editor-actions-regression-fix66
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix66.py
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JS syntax
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-editor-actions-regression-fix66.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__');x.write_bytes(base64.b64decode(f['content_base64']));subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Regression checks 1-12
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,re
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-editor-actions-regression-fix66.json').read_text())
          fs={f['path']:base64.b64decode(f['content_base64']) for f in p['files']}
          h=fs['js/97-home-ui.js'].decode(); pop=fs['popup.js'].decode(); ph=fs['popup.html'].decode()
          checks={
            'shared surname':"viena_asignar_multiple_filtro" in h,
            'simple nav':'data-section=\\\"tools\\\"' not in h and 'data-section=\\\"diagnostics\\\"' not in h,
            'responsive':'@media(max-width:760px)' in h,
            'motion':'viena-view-in' in h,
            'compact toast':'max-width:min(340px' in h,
            'folder adjacent':'openAdjacentExtensionTab' in h,
            'compact popup':'width:448px' in ph,
            'new editor entry':'popup.html?full=1#personalization' in pop and 'VIENA_OPEN_BUTTON_EDITOR' not in pop,
            'editor cleanup':'Buscar entre mis botones' in h,
            'icon visible':'personalization-block-label' in h and 'Apariencia' in h,
            'no native confirm':'alert(' not in h and 'confirm(' not in h,
            'actions':'editor-main-actions' in h and 'editorIsDirty' in h and 'Descartar cambios' in h
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-editor-actions-regression-fix66.json dev/self-update.json dev/history.json
          git commit -m "dev: build editor actions regression fix66"
          git push origin HEAD:dev/editor-actions-regression-fix66
