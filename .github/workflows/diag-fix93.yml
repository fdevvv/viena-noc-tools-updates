name: Diagnose fix93 update UI
on:
  push:
    branches: [dev/update-layout-info-coherence-fix93]
    paths:
      - tools/diag_fix93.py
      - .github/workflows/diag-fix93.yml
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/update-layout-info-coherence-fix93
      - run: python3 tools/diag_fix93.py
