name: OPS promote RELEASE 1.3.37

on:
  push:
    branches:
      - ops/promote-release-1.3.37
    paths:
      - .github/workflows/ops-promote-release-137.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/promote-release-1.3.37
          fetch-depth: 0

      - name: Prepare release pointer
        run: |
          python3 tools/prepare_release_pointer.py \
            --candidate "release/v1.3.37-release-history-137-fix53-candidate1-package.json" \
            --minimum "1.3.25" \
            --notes $'Se mejoró la confiabilidad del registro de instalaciones y la actualización de actividad de los operadores.\nEl historial visible del popup incorpora las RELEASES 1.3.36 y 1.3.37.'

      - name: Validate modern pointer
        run: |
          python3 tools/validate_release_compat.py --pointer --pointer-file release/latest.json
          python3 tools/test_release_validator.py --pointer-file release/latest.json
          python3 tools/validate_update_matrix.py --pointer-file release/latest.json

      - name: Commit pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          git commit -m "release: promote modern 1.3.37"
          git push origin HEAD:ops/promote-release-1.3.37
