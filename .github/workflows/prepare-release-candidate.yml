name: Prepare RELEASE candidate from DEV

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "New RELEASE semver, e.g. 1.3.31"
        required: true
        type: string
      candidate_number:
        description: "Immutable candidate number"
        required: true
        default: "1"
        type: string
      confirmation:
        description: "Type BUILD to create the candidate PR"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow dispatch inputs
        run: |
          echo "release_version=${{ inputs.release_version }}"
          echo "candidate_number=${{ inputs.candidate_number }}"
          test "${{ inputs.confirmation }}" = "BUILD"
