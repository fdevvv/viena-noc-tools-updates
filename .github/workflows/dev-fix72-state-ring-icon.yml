name: DEV fix72 state ring icon
on:
  push:
    branches: [dev/state-ring-icon-fix72]
    paths:
      - tools/ops_build_fix72.py
      - .github/workflows/dev-fix72-state-ring-icon.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/state-ring-icon-fix72
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix72.py
      - name: Validate exact DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-state-ring-icon-fix72.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Acceptance checks
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-state-ring-icon-fix72.json').read_text())
          bg=base64.b64decode(next(f['content_base64'] for f in p['files'] if f['path']=='background.js')).decode()
          checks={
            'ring colors':'ICON_RING_COLORS' in bg,
            'ring renderer':'renderExtensionIconState' in bg and 'ctx.strokeStyle=color' in bg,
            'state helper':'setActionStateVisual' in bg,
            'active ring':"setActionStateVisual('on'" in bg,
            'update ring':"setActionStateVisual('update'" in bg,
            'reload ring':"setActionStateVisual('reload'" in bg,
            'tab ring':"setActionStateVisual('tabs'" in bg,
            'csp safe':'fetch(dataUrl)' not in bg,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-state-ring-icon-fix72.json dev/self-update.json dev/history.json
          git commit -m "dev: build state ring icon fix72"
          git push origin HEAD:dev/state-ring-icon-fix72
