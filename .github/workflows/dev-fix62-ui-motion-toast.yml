name: DEV fix62 UI motion toast

on:
  push:
    branches:
      - dev/ui-motion-toast-fix62
    paths:
      - tools/ops_build_fix62.py
      - .github/workflows/dev-fix62-ui-motion-toast.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/ui-motion-toast-fix62
          fetch-depth: 0
      - name: Build candidate
        run: python3 tools/ops_build_fix62.py
      - name: Validate DEV matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate JS syntax
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-ui-motion-toast-fix62.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              path=pathlib.Path('/tmp')/f['path'].replace('/','__')
              path.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(path)],check=True)
          PY
      - name: Validate targeted UI changes
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-ui-motion-toast-fix62.json').read_text())
          wanted={'js/97-home-ui.js','popup.html','js/30-corporate-detail.js'}
          files={f['path']:base64.b64decode(f['content_base64']).decode('utf-8') for f in p['files'] if f['path'] in wanted}
          assert 'fix62 — motion feedback + compact notifications' in files['js/97-home-ui.js']
          assert 'prefers-reduced-motion:reduce' in files['js/97-home-ui.js']
          assert 'fix62 — compact toast + button feedback' in files['popup.html']
          assert "maxWidth:'min(360px, calc(100vw - 28px))'" in files['js/30-corporate-detail.js']
          assert "const ASSIGN_KEY='viena_asignar_multiple_filtro';" in files['js/97-home-ui.js']
          print('PASS targeted UI motion/toast checks')
          PY
      - name: Commit candidate to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-ui-motion-toast-fix62.json dev/self-update.json dev/history.json
          git commit -m "dev: build UI motion toast fix62"
          git push origin HEAD:dev/ui-motion-toast-fix62
