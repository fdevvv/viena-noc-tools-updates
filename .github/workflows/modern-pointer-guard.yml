name: Modern pointer guard

on:
  push:
    paths:
      - "release/latest.json"

permissions:
  contents: write

concurrency:
  group: modern-pointer-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate modern pointer
        id: validate
        continue-on-error: true
        run: |
          python3 tools/validate_bootstrap.py --public &&
          python3 tools/validate_release_compat.py --pointer --pointer-file release/latest.json &&
          python3 tools/test_release_validator.py --pointer-file release/latest.json &&
          python3 tools/validate_update_matrix.py --pointer-file release/latest.json

      - name: Restore previous pointer on failure
        if: steps.validate.outcome == 'failure'
        run: |
          git show HEAD^:release/latest.json > release/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          git commit -m "safety: auto-revert invalid modern release pointer"
          git push origin HEAD:main
          echo "Invalid modern pointer was automatically reverted."
          exit 1
