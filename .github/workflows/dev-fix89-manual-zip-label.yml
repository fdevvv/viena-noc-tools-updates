name: DEV fix89 manual ZIP label
on:
  push:
    branches: [dev/manual-zip-label-fix89]
    paths:
      - tools/ops_build_fix89.py
      - .github/workflows/dev-fix89-manual-zip-label.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/manual-zip-label-fix89
          fetch-depth: 0
      - name: Build DEV fix89
        run: python3 tools/ops_build_fix89.py
      - name: Validate DEV updater matrix
        run: python3 tools/validate_dev_matrix.py
      - name: Validate packaged JavaScript
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-manual-zip-label-fix89.json').read_text())
          for f in p['files']:
            if f['path'].endswith('.js'):
              x=pathlib.Path('/tmp')/f['path'].replace('/','__')
              x.write_bytes(base64.b64decode(f['content_base64']))
              subprocess.run(['node','--check',str(x)],check=True)
          PY
      - name: Validate popup label regression
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          p=json.loads(pathlib.Path('dev/builds/1.3.26-dev-manual-zip-label-fix89.json').read_text())
          files={f['path']:base64.b64decode(f['content_base64']).decode(errors='replace') for f in p['files']}
          h=files['popup.html']; j=files['popup.js']
          checks={
            'short label':'Descargar ZIP · v${target.latest}' in j,
            'old long label removed':'Descargar ZIP manual · v${target.latest}' not in j,
            'nowrap':'white-space:nowrap!important;' in h,
            'DEV eligibility preserved':"new Set(['efoschi'])" in j,
            'RELEASE eligibility preserved':"new Set(['mbruno'])" in j,
            'release target preserved':'VIENA_NOC_Tools_RELEASE_v${latest}.zip' in j,
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/builds/1.3.26-dev-manual-zip-label-fix89.json dev/self-update.json dev/history.json
          git commit -m "dev: shorten manual ZIP label fix89"
          git push origin HEAD:dev/manual-zip-label-fix89
