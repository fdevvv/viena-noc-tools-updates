name: Promote RELEASE 1.3.39 METRICAS_SYNC
on:
  push:
    branches: [release/promote-1.3.39-metricas-sync]
    paths:
      - .github/workflows/promote-release-139-metricas.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/promote-1.3.39-metricas-sync
          fetch-depth: 0
      - name: Prepare release pointer
        run: |
          python3 tools/prepare_release_pointer.py             --candidate release/v1.3.39-metricas-sync-global-candidate1-package.json             --notes $'Métricas comparte la referencia de seguimiento entre operadores para usar el mismo punto de partida.\nSi los valores aumentan después de la marca, el nodo se muestra violeta y Ctrl + doble click reconoce los nuevos valores.\nEl estado de sincronización se muestra en la cabecera y, si no está disponible, Métricas continúa en modo local.'
      - name: Validate pointer target
        run: |
          python3 tools/validate_release_compat.py
      - name: Commit promotion pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/latest.json
          git commit -m "release: promote 1.3.39"
          git push origin HEAD:release/promote-1.3.39-metricas-sync
